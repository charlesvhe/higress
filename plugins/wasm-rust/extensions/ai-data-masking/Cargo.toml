[package]
name = "ai-data-masking"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib"]

[dependencies]
aho-corasick = "1"
higress-wasm-rust = { path = "../../", version = "0.1.0" }
proxy-wasm = { git = "https://github.com/charlesvhe/proxy-wasm-rust-sdk", rev = "339466a0ceec01e5a7d05347e9d86f57c1daa218" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fancy-regex = "0.19"
hmac-sha256 = "1"
grok = "2"
lazy_static = "1"
jieba-rs = "0"
rust-embed = "8.5.0"
jsonpath-rust = "0"

[package]
name = "demo-wasm"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib"]

[dependencies]
higress-wasm-rust = { path = "../../", version = "0.1.0" }
proxy-wasm = { git = "https://github.com/charlesvhe/proxy-wasm-rust-sdk", rev = "339466a0ceec01e5a7d05347e9d86f57c1daa218" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
multimap = "*"
http = "*"
redis={version = "0", default-features = false}
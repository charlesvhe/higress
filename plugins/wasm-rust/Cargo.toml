[package]
name = "higress-wasm-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
proxy-wasm = { git = "https://github.com/charlesvhe/proxy-wasm-rust-sdk", rev = "339466a0ceec01e5a7d05347e9d86f57c1daa218" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
multimap = "0"
http = "1"
lazy_static = "1"
downcast-rs="1"
redis={version = "0", default-features = false}
